name: agentic-newsroom

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-local-dev-encryption-key}
      N8N_USER_MANAGEMENT_DISABLED: ${N8N_USER_MANAGEMENT_DISABLED:-true}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/New_York}
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n

  python-agent-runner:
    build:
      context: ./python-agent-runner
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      DRY_RUN: ${DRY_RUN:-true}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-placeholder}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080}
      RSS_FEED_URLS: ${RSS_FEED_URLS:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-memory}
    ports:
      - "127.0.0.1:${PYTHON_AGENT_RUNNER_PORT:-8000}:8000"
    volumes:
      - python_agent_runner_data:/app/data

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles:
      - ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    profiles:
      - searxng
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_PUBLIC_BASE_URL:-http://localhost:8080/}
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8080}:8080"
    volumes:
      - searxng_data:/etc/searxng

volumes:
  postgres_data:
  n8n_data:
  python_agent_runner_data:
  ollama_data:
  searxng_data:
